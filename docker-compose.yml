services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketmind
      POSTGRES_USER: marketmind
      POSTGRES_PASSWORD: marketmind_local
    volumes: [marketmind_db:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U marketmind"], interval: 5s, timeout: 3s, retries: 10}
  backend:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://marketmind:marketmind_local@db/marketmind
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"], interval: 10s, timeout: 3s, retries: 10}
  frontend:
    build: {context: ./frontend, args: {BACKEND_URL: "http://backend:8000"}}
    environment: {BACKEND_URL: "http://backend:8000"}
    ports: ["3000:3000"]
    depends_on: {backend: {condition: service_healthy}}
volumes: {marketmind_db: {}}
